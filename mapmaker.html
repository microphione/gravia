nt:space-between;align-items:center;gap:0 16px;width:100%;padding:5px 12px;display:flex}.menu-item:hover:not([aria-disabled=true]),.menu-item:focus{background:#3a5a9a;outline:none}.menu-item[aria-disabled=true]{opacity:.55;cursor:default}.menu-hint{color:#9a9ab0;font-size:11px}.menu-reason{color:#c0c0d0;flex-basis:100%;font-size:11px}.menu-heading{color:#9a9ab0;text-transform:uppercase;padding:4px 12px 2px;font-size:11px}.menu-separator{background:#33334a;height:1px;margin:4px 0}@media (pointer:coarse){.menu-item{min-height:36px}}#banner{z-index:5;color:#ffd040;background:#1c1c28;border:1px solid #44445c;border-radius:4px;align-items:center;gap:10px;max-width:60%;padding:4px 8px;display:flex;position:absolute;top:6px;left:50%;transform:translate(-50%)}.props-box{box-sizing:border-box;background:#1c1c28;border:1px solid #44445c;border-radius:4px;outline:none;width:520px;max-width:96vw;max-height:92vh;padding:12px;overflow-y:auto}.props-box h2{margin:0 0 6px;font-size:14px}.props-box h3{color:#9a9ab0;margin:10px 0 4px;font-size:12px}.props-box canvas{object-fit:contain;background:#101018;width:32px;height:32px;position:static}.props-row{align-items:center;gap:6px;margin-bottom:4px;display:flex}.props-row input[type=text]{flex:1;min-width:0}.props-row input[readonly]{color:#9a9ab0;background:#16161f}.props-row select{min-width:0;max-width:150px}.props-error{color:#ff9a8a;margin:8px 0 0}.props-buttons{justify-content:flex-end;gap:6px;margin-top:10px;display:flex}.mw-box{box-sizing:border-box;background:#1c1c28;border:1px solid #44445c;border-radius:4px;outline:none;flex-direction:column;width:760px;max-width:96vw;max-height:92vh;padding:12px;display:flex}.mw-title{margin:0 0 8px;font-size:14px}.mw-body{flex:1;gap:12px;min-height:0;display:flex}.mw-side{flex-direction:column;flex:none;gap:6px;width:210px;min-height:0;display:flex}.mw-search{box-sizing:border-box;flex:none;width:100%}.mw-list{flex-direction:column;flex:1;gap:2px;min-height:0;display:flex;overflow-y:auto}.mw-kind{text-align:left;flex-wrap:wrap;flex:none;align-items:baseline;gap:0 6px;display:flex}.mw-kind-id,.mw-badges{color:#9a9ab0;font-size:11px}.mw-badges{width:100%}.mw-kind.bad{border-color:#ff9a8a}.mw-list-buttons{gap:4px;display:flex}.mw-detail{flex:1;min-width:0;padding-right:6px;overflow-y:auto}.mw-section{margin-bottom:8px}.mw-head{text-transform:uppercase;color:#9a9ab0;margin:6px 0 4px;font-size:12px}.mw-hint{color:#9a9ab0;margin:0 0 4px;font-size:11px}.mw-field,.mw-cell{flex-wrap:wrap;align-items:center;gap:2px 6px;margin-bottom:3px;display:flex}.mw-field .mw-label{width:190px}.mw-cell .mw-label{color:#9a9ab0;width:100%;font-size:11px}.mw-number{width:84px}.mw-text{width:170px}.mw-fixed{color:#9a9ab0}.mw-unit{color:#9a9ab0;font-size:11px}.mw-duration{color:#c0c0d0}.mw-sentence{color:#ff9a8a;flex-basis:100%;margin:0 0 2px}.mw-sentence:empty{display:none}.mw-loot{background:#232334;border-radius:3px;flex-wrap:wrap;align-items:flex-end;gap:6px;margin-bottom:4px;padding:4px;display:flex}.mw-loot .mw-cell{flex-direction:column;flex:none;align-items:flex-start;margin-bottom:0}.mw-loot .mw-cell:first-child{flex:150px;min-width:0}.mw-loot select{width:100%;min-width:0}.mw-loot button{padding-left:6px;padding-right:6px}.mw-loot .mw-number{width:56px}.mw-loot .mw-sentence{font-size:11px}.mw-detail{overflow-x:hidden}[aria-invalid=true]{border-color:#ff9a8a}.mw-notice{color:#ffd040;margin:8px 0 0}.mw-notice[hidden]{display:none}.mw-buttons{justify-content:flex-end;gap:6px;margin-top:10px;display:flex}@media (height<=480px){#topbar{padding:1px 6px}#toolbar{gap:2px 8px;padding:2px 6px}#tools .icon{width:16px;height:16px}#side{width:220px}#tool-options{padding:3px 6px}#tool-options button{padding:1px 5px}#spawn-options p{min-height:0;margin:2px 0;font-size:11px}#markers p{min-height:0;margin:2px 0 0;font-size:11px}.piece-line{min-height:0}#side-body{padding:6px}#levels{max-height:50vh}}.fatal{color:#e0e0e0;margin:16px;font-family:sans-serif}</style>

    <link rel="modulepreload" crossorigin href="./assets/CanvasPool-D071ZhP4.js">
    <link rel="modulepreload" crossorigin href="./assets/canvasUtils-G1F85v5_.js">

  <body>
    <noscript><p class="fatal">The map maker needs JavaScript.</p></noscript>
    <div id="topbar">
      <button type="button" id="general" aria-haspopup="menu" aria-expanded="false">General</button>
    </div>
    <div id="page-map">
    <div id="main">
      <div id="toolbar" role="toolbar" aria-label="Map maker tools">
        <div class="row" id="tools"></div>
        <div class="row" id="history"></div>
        <div class="row" id="windows"></div>
      </div>
      <div id="view">
        <div id="legend"></div>
      </div>
      <div id="status"></div>
    </div>
    <aside id="side">
      <div id="tool-options" data-tool="brush">
        <section id="piece"></section>
        <section id="markers"></section>
      </div>
      <div id="side-body">
        <section id="palette">
          <h2>Palette</h2>
        </section>
        <section id="tile-types">
          <h2>Tile types</h2>
          <p class="hint">Right click a palette tile (long press on a touch screen) to edit it.</p>
        </section>
      </div>
    </aside>
    </div>
    <!-- The page of the Monsters tab; the tab itself comes with the Monsters wave of plan item 2.130. -->
    <div id="page-monsters" hidden></div>
    <div id="props" role="dialog" aria-modal="true" aria-label="Tile properties" hidden></div>
    <div id="monsters" role="dialog" aria-modal="true" aria-labelledby="monsters-title" hidden></div>
    <div id="loot-dialog" role="dialog" aria-modal="true" aria-labelledby="loot-title" hidden></div>
    <div id="professions" role="dialog" aria-modal="true" aria-labelledby="professions-title" hidden></div>
    <div id="draft" role="dialog" aria-modal="true" aria-label="Unsaved working copy" hidden></div>
  </body>
</html>
